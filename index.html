<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VariLink</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>/* Layout: drawing-sheet logic. A header strip, a title block for each change, and ledgers below. */
:root{--paper:#f2f4f3;--sheet:#fff;--ink:#14212b;--muted:#566571;--line:#d3dbdc;--accent:#0a56a0;--accent-ink:#fff;--soft:#e5eef6;--omit:#b3261e;--omit-soft:#fbe9e7;--add:#17703c;--add-soft:#e3f3e8;--abort:#8a5a00;--abort-soft:#fbf0d9;
--head:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10181e;--sheet:#172229;--ink:#e6edf0;--muted:#9fb0ba;--line:#2e3d46;--accent:#6db1f0;--accent-ink:#08253d;--soft:#1c3346;--omit:#ff9b92;--omit-soft:#40201e;--add:#77d39c;--add-soft:#173524;--abort:#eabf6a;--abort-soft:#3a2d12;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#10181e;--sheet:#172229;--ink:#e6edf0;--muted:#9fb0ba;--line:#2e3d46;--accent:#6db1f0;--accent-ink:#08253d;--soft:#1c3346;--omit:#ff9b92;--omit-soft:#40201e;--add:#77d39c;--add-soft:#173524;--abort:#eabf6a;--abort-soft:#3a2d12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--body)}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
p{margin:0}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--sheet);border-bottom:2px solid var(--ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 21px var(--head);letter-spacing:.02em;border:0;background:none;color:var(--ink);cursor:pointer;padding:0}
.brand span{color:var(--accent)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);flex:1;min-width:0}
.crumbs button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:2px}
.main{max-width:1240px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.main>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}.stack>*{min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.sample{font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--abort);background:var(--abort-soft);padding:3px 8px}
.sheet{background:var(--sheet);border:1px solid var(--line);padding:16px;min-width:0}
.titleblock{background:var(--sheet);border:2px solid var(--ink);display:grid;grid-template-columns:minmax(0,2.2fr) repeat(4,minmax(0,1fr))}
.titleblock>div{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.titleblock>div:first-child{border-left:0}
.tb-label{font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block}
.tb-val{font:600 20px var(--head)}
.tb-val.mono{font:600 16px var(--mono)}
.omit{color:var(--omit)}.add{color:var(--add)}.abort{color:var(--abort)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);font:600 16px var(--head);padding:8px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
button.btn,label.btn,a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:600 14px var(--body);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:none;color:var(--accent);padding:4px 6px}
button.danger{color:var(--omit)}
summary{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:6px 8px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
td input,td select{padding:4px 6px;background:transparent}
input[type=checkbox]{width:auto}
.field{display:grid;gap:3px}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid>*{min-width:0}
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12px var(--body);letter-spacing:.03em;text-align:left;color:var(--muted);background:var(--paper);border-bottom:1px solid var(--ink);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.band td{font:600 14px var(--head);background:var(--paper);letter-spacing:.03em}
tr.total td{font-weight:700;border-top:1px solid var(--ink)}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--soft)}
.chip{display:inline-block;font:600 12px var(--body);padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.chip.Omission{color:var(--omit)}.chip.Addition{color:var(--add)}.chip.Abortive{color:var(--abort)}
.chip.ok{color:var(--add)}.chip.wait{color:var(--abort)}.chip.stop{color:var(--omit)}.chip.ai{color:var(--accent)}
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.stage{flex:0 0 210px;border:1px solid var(--line);border-top:3px solid var(--accent);background:var(--sheet);padding:10px;display:grid;gap:6px}
.link-delta{flex:0 0 96px;display:grid;place-content:center;text-align:center;font:500 12px var(--mono);color:var(--muted);padding:0 6px;border-block:1px dashed var(--line);align-self:center;min-height:44px}
.alerts{display:grid;gap:6px}
.alert{padding:7px 10px;border-left:3px solid var(--abort);background:var(--abort-soft);font-size:14px}
.alert.error{border-color:var(--omit);background:var(--omit-soft)}
.alert.good{border-color:var(--add);background:var(--add-soft)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;background:var(--accent)}
.bar i.neg{background:var(--omit)}
dialog{border:2px solid var(--ink);background:var(--sheet);color:var(--ink);padding:18px;width:min(640px,calc(100vw - 32px));max-height:86vh;overflow:auto}
dialog::backdrop{background:rgb(10 20 30/.55)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;z-index:30;max-width:calc(100vw - 32px)}
.pre{font:12px/1.4 var(--mono);white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);padding:8px;max-height:160px;overflow:auto}
.route{display:grid;gap:8px;border:1px solid var(--line);padding:12px;min-width:0}
@media (max-width:800px){.titleblock{grid-template-columns:repeat(2,minmax(0,1fr))}.titleblock>div:first-child{grid-column:1/-1}.titleblock>div{border-left:0;border-top:1px solid var(--line)}.titleblock>div:first-child{border-top:0}.bar{grid-template-columns:90px minmax(0,1fr) 100px}}
@media (prefers-reduced-motion:no-preference){.tabs button{transition:background .12s}}

.drop{display:grid;gap:2px;border:2px dashed var(--accent);background:var(--soft);padding:12px 14px;cursor:pointer}
.drop:hover{background:var(--sheet)}
label.primary-l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.analyse{border:2px solid var(--accent)}
</style></head><body><header class="top"><button class="brand" id="brand">Vari<span>Link</span></button><nav class="crumbs" id="crumbs" aria-label="Location"></nav></header>

  function measurementBasis(contractType) {

  function computeLine(line, pkg, change) {

function chunkText(pages){const out=[];pages.forEach(p=>{const t=String(p.text||'').replace(/\s+/g,' ').trim();for(let i=0;i<t.length;i+=800)out.push({page:p.page,text:t.slice(i,i+900)})});return out}
async function extractPages(file,buf){const ext=(file.name.split('.').pop()||'').toLowerCase();if(ext==='pdf'){const r=await pdfPages(new File([buf],file.name));return r}if(['xls','xlsx','xlsm'].includes(ext)){const b=Rd.bookFrom(XLSX,buf,file.name);return {pages:b.sheets.filter(s=>!s.hidden).map(s=>({page:s.name,text:s.rows.map(r=>(r||[]).filter(v=>v!=null).join(' ')).join('\n')})),scanned:false}}if(ext==='msg'){const m=Rd.msgFrom(XLSX,buf);return {pages:[{page:'Email',text:m.subject+'\n'+m.body}],scanned:false}}return {pages:[],scanned:false}}
async function pdfPages(file){const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const pages=[];let words=0;const n=Math.min(doc.numPages,400);for(let p=1;p<=n;p++){const t=await (await doc.getPage(p)).getTextContent();const s=t.items.map(i=>i.str).join(' ');words+=s.split(/\s+/).length;pages.push({page:p,text:s})}return {pages,scanned:words<doc.numPages*8}}
async function addLibrary(file,category){const k=K(),buf=await file.arrayBuffer();const r=await extractPages(file,buf);const chunks=chunkText(r.pages);const key='lib/'+k.id+'/'+Date.now()+'/'+file.name;await putFile(key,file);await putFile('text/'+key,new Blob([JSON.stringify(chunks)]));k.docs.push({category,name:file.name,rev:'',date:today(),key,indexed:chunks.length,scanned:r.scanned});save();return {chunks:chunks.length,scanned:r.scanned}}
async function loadChunks(key){const f=await getFile('text/'+key);if(!f)return [];return JSON.parse(await f.blob.text())}

 const rel=[];for(const d of k.docs){if(!d.chunks&&(!d.key||!d.indexed))continue;(d.chunks||await loadChunks(d.key)).forEach(ch=>{const s=Rd.overlap(q,ch.text);if(s>=3)rel.push({doc:d.name,category:d.category,page:ch.page,score:s,text:ch.text.slice(0,420),key:d.key})})}

 dialog(`<h2>Move to next stage</h2><p>This keeps the title <strong>${esc(c.title)}</strong> and freezes today's assessment of <span class="mono">${money(net)}</span>.</p>${moved?`<div class="alert">This is ${money(moved)} different from ${esc(last.kind)} ${esc(last.no)}. Give the reason below.</div>`:''}${dSel('kind','New stage',STAGES,next)}${dInput('no','Number')}${dInput('date','Date',new Date().toISOString().slice(0,10),true,'date')}<label class="field"><span>Reason for move</span><textarea name="reason" ${moved?'required':''}></textarea></label>`,d=>{c.stages.push({kind:d.kind,no:d.no,date:d.date,status:'Draft',amount:net,approved:'',letterRef:'',deltaReason:d.reason});save();view.tab='chain';render();toast(`${d.kind} ${d.no} linked to ${c.id}`)})}

/* ---------- events ---------- */
function bind(path,v,el){const k=K(),c=C(),a=path.split('.');const nums=['riskPct','takeoffQty','executedQty','contractorQty','contractorRate','rate','factor','qty','amount','approved','markupPct','vatPct'];const cast=f=>el.type==='checkbox'?el.checked:nums.includes(f)&&v!==''?Number(v):v;
 if(a[0]==='pkg')k[a[1]]=a[1]==='contractAmount'?(v===''?null:Number(v)):v;else if(a[0]==='c')k.contract[a[1]]=cast(a[1]);else if(a[0]==='boq')k.boq[+a[1]][a[2]]=cast(a[2]);else if(a[0]==='line')c.lines[+a[1]][a[2]]=cast(a[2]);else if(a[0]==='bd')c.lines[+a[1]].breakdown[+a[2]][a[3]]=cast(a[3]);else if(a[0]==='st')c.stages[+a[1]][a[2]]=cast(a[2]);else if(a[0]==='si')c.si[+a[1]][a[2]]=v;else if(a[0]==='ch')c[a[1]]=a[1]==='riskPct'?(v===''?null:Number(v)):v;else if(a[0]==='cl')k.clauses[+a[1]][a[2]]=v;else if(a[0]==='ty')k.types[+a[1]][a[2]]=a[2]==='count'?Number(v):v;else if(a[0]==='fi')c.findings[+a[1]][a[2]]=v;else if(a[0]==='vo'){const vo=k.vos[+a[1]],it=vo.items[+a[2]];it.amount=Number(v);syncVO(vo)}else if(a[0]==='ab'){c.abortive=c.abortive||{};c.abortive[a[1]]=v}
 save();render()}
function syncVO(vo){const k=K();vo.items.forEach(it=>{const c=k.changes.find(x=>x.id===it.changeId);if(!c)return;const s=(c.stages||[]).find(x=>x.kind==='VO'&&x.no===vo.no);if(s){s.amount=E.num(it.amount);s.status=vo.status==='Approved'?'Approved':'Draft';s.approved=vo.status==='Approved'?E.num(it.amount):''}})}
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.bind){bind(t.dataset.bind,t.value,t);return}
 if(t.dataset.clauseLink){const c=C(),id=t.dataset.clauseLink;c.clauseOff=(c.clauseOff||[]).filter(x=>x!==id);c.clauseOn=(c.clauseOn||[]).filter(x=>x!==id);(t.checked?c.clauseOn:c.clauseOff).push(id);save();return render()}
 if(t.dataset.act==='smart'){const fs=[...t.files];t.value='';return smartFiles(fs,t.dataset.hint)}
 if(t.dataset.act==='newDrawings'){const fs=[...t.files];t.value='';for(const f of fs)await addDoc(f,'New drawing',{});render();return toast(fs.length+' new drawings saved with this change.')}
 if(t.dataset.doc){const f=t.files[0];const cat=t.dataset.doc;t.value='';if(!f)return;try{const r=await addLibrary(f,cat);render();toast(r.scanned?'Saved. Scanned, so AI needs it attached.':r.chunks+' sections indexed.')}catch(err){toast(err.message||'The file could not be read.')}return}
 const f=t.files&&t.files[0];if(!f)return;
 try{ if(t.dataset.doc){const k=K();k.docs.push({category:t.dataset.doc,name:f.name,rev:'',date:new Date(f.lastModified).toISOString().slice(0,10)});save();render();return}
  if(t.dataset.act==='importJson'){const j=JSON.parse(await f.text());if(!j.id||!j.packages)throw new Error('This is not a VariLink project file.');const i=state.projects.findIndex(p=>p.id===j.id);i>=0?state.projects[i]=j:state.projects.push(j);save();go({p:j.id});return}
 }catch(err){toast(err.message||'The file could not be read.')}});
document.addEventListener('click',async e=>{const b=e.target.closest('button,tr.link');if(!b)return;const d=b.dataset,k=K(),c=C();
 try{
 if(d.delProject){const pr=state.projects.find(x=>x.id===d.delProject);return dialog(`<h2>Delete project</h2><p>This removes <strong>${esc(pr.name)}</strong> and all its packages from this browser. Type DELETE to confirm.</p>${dInput('ok','Confirmation')}`,x=>{if(x.ok.trim().toUpperCase()!=='DELETE')return toast('Project kept.');state.projects=state.projects.filter(y=>y.id!==pr.id);save();go({});toast('Project deleted.')})}
 if(d.go==='home')return go({});if(d.go==='p')return go({p:view.p});if(d.go==='k')return go({p:view.p,k:view.k});
 if(d.openProject)return go({p:d.openProject});if(d.openPackage)return go({p:view.p,k:d.openPackage});if(d.openChange)return go({p:view.p,k:view.k,c:d.openChange});
 if(d.tab){view.tab=d.tab;try{location.hash='v-'+[view.p,view.k,view.c&&view.c.toLowerCase(),view.tab].map(x=>x||'x').join('-')}catch(x){}return render()}
 if(d.addLine){c.lines.push(d.addLine==='Omission'?{id:uid('l'),action:'Omission',scope:'partial',boqCode:'',takeoffQty:''}:{id:uid('l'),action:'Addition',desc:'',unit:'',takeoffQty:'',rateSource:'BOQ',rateRef:''});save();return render()}
 if(d.delLine){c.lines.splice(+d.delLine,1);save();return render()}
 if(d.useRate){const [i,code]=d.useRate.split('|');const l=c.lines[+i];if(l.action==='Omission'){l.boqCode=code}else{l.rateSource='Similar';l.rateRef=code}save();return render()}
 if(d.cand){const [act,code]=d.cand.split('|');const b=E.findBoq(k,code);c.lines.push(act==='Omission'?{id:uid('l'),action:'Omission',scope:'partial',boqCode:code,takeoffQty:''}:{id:uid('l'),action:'Addition',desc:b.desc,unit:b.unit,discipline:b.discipline,takeoffQty:'',rateSource:'BOQ',rateRef:code});save();return render()}
 if(d.delClause){k.clauses.splice(+d.delClause,1);save();return render()}
 if(d.delType){k.types.splice(+d.delType,1);save();return render()}
 if(d.delCdoc){c.docs.splice(+d.delCdoc,1);save();return render()}
 if(d.getFile){const f=await getFile(d.getFile);if(!f)return toast('This file is not in this browser.');return await saveBlob(f.name,f.blob)}
 if(d.voApprove){const v=k.vos[+d.voApprove];v.status=v.status==='Approved'?'Draft':'Approved';syncVO(v);save();return render()}
 if(d.voExport)return await exportVO(k.vos[+d.voExport]);
 if(d.delBoq){k.boq.splice(+d.delBoq,1);save();return render()}
 if(d.delDoc){k.docs.splice(+d.delDoc,1);save();return render()}
 if(d.delSi){c.si.splice(+d.delSi,1);save();return render()}
 if(d.addBd){const l=c.lines[+d.addBd];l.breakdown=l.breakdown||[];l.breakdown.push({cat:'Supply',item:'',unit:'',qty:1,rate:0});save();return render()}
 if(d.delBd){const [i,j]=d.delBd.split('.');c.lines[+i].breakdown.splice(+j,1);save();return render()}
 if(d.aiCopy){const t=aiPrompt(d.aiCopy);try{await navigator.clipboard.writeText(t);b.textContent='Copied. Now paste it in the chat';toast('Request copied.')}catch(x){const ta=document.getElementById('ai-reply-'+d.aiCopy);ta.value=t;ta.select();toast('Copy this request from the box.')}return}
 if(d.aiSample){document.getElementById('ai-reply-'+d.aiSample).value=SAMPLE_REPLY();return aiApply(d.aiSample)}
 if(d.aiApply)return aiApply(d.aiApply);if(d.aiRun)return await aiRun(d.aiRun);
 switch(d.act){
  case 'settings':return openSettings();
  case 'newProject':return dialog(`<h2>New project</h2>${dInput('name','Project name')}${dInput('client','Client')}${dInput('currency','Currency','EGP')}`,x=>{const id=uid('p');state.projects.push({id,name:x.name,client:x.client,currency:x.currency,packages:[]});save();go({p:id})});
  case 'newPackage':return dialog(`<h2>New package</h2>${dInput('code','Package code','PK-')}${dInput('name','Package name')}${dInput('contractor','Contractor')}${dSel('type','Contract type',CONTRACTS,'Lump Sum')}`,x=>{const id=uid('k');P().packages.push({id,code:x.code,name:x.name,contractor:x.contractor,contract:{type:x.type,typeOther:'',markupPct:30,vatPct:14,designFeesIncluded:'No',iftIsIfc:'Yes',geotech:'Yes',pricingClause:'',paymentClause:'',notes:''},docs:[],boq:[],changes:[]});save();go({p:view.p,k:id,tab:'contract'})});
  case 'newChange':return newChange();case 'convert':return convertStage();
  case 'addClause':k.clauses=k.clauses||[];k.clauses.push({id:uid('c'),topic:'Variation pricing',ref:'',text:''});save();return render();
  case 'addType':k.types=k.types||[];k.types.push({name:'',count:1});save();return render();
  case 'newVO':return newVO();
  case 'analyse':return await analyseChange();
  case 'addBoq':k.boq.push({code:'',desc:'',unit:'',qty:0,rate:0,discipline:''});save();return render();
  case 'addSi':c.si=c.si||[];c.si.push({no:'',date:'',ref:''});save();return render();
  case 'exportVA':return await exportVA();case 'exportLog':return await exportLog();case 'exportProjectLog':return await exportProjectLog();
  case 'exportJson':{const p=P();return await saveBlob(`${p.name}.varilink.json`,new Blob([JSON.stringify(p,null,1)],{type:'application/json'}))}
  case 'tplBoq':return await template('BOQ template.xlsx',['Code','Description','Unit','Qty','Rate','Discipline'],[['F-101','Sample item','m2',100,250,'Finishes']]);
  case 'tplTakeoff':return await template('Take-off template.xlsx',['Code','Description','Unit','Original Qty','Revised Qty'],[['F-101','Sample item','m2',100,80]]);
  case 'applyTakeoff':{let n=0;takeoffRows.filter(r=>r.action).forEach(r=>{const q=Math.abs(r.delta);if(r.action==='Omission')c.lines.push({id:uid('l'),action:'Omission',scope:r.scope,boqCode:r.boq?r.code:'',takeoffQty:q});else c.lines.push({id:uid('l'),action:'Addition',desc:r.desc||(r.boq&&r.boq.desc)||'',unit:r.unit||(r.boq&&r.boq.unit)||'',takeoffQty:q,rateSource:r.boq?'BOQ':'Manual',rateRef:r.boq?r.code:'',discipline:r.boq&&r.boq.discipline});n++});takeoffRows=null;save();render();return toast(`${n} lines created.`)}
 }}catch(err){toast(err.message||'That action failed.')}});
window.addEventListener('hashchange',()=>{const b=JSON.stringify(view);fromHash();if(JSON.stringify(view)!==b)render()});
document.addEventListener('input',e=>{const m=(e.target.id||'').match(/^ai-reply-(.+)/);if(m)aiText[m[1]]=e.target.value});
document.addEventListener('paste',e=>{const m=(e.target.id||'').match(/^ai-reply-(.+)/);if(m)setTimeout(()=>{if(/\{[\s\S]*\}/.test(e.target.value))aiApply(m[1])},0)});
$('#brand').addEventListener('click',()=>go({}));
fromHash();if(!view.p&&state.projects.length)view={p:state.projects[0].id,k:null,c:null,tab:null};render();
})();
</script></body></html>
