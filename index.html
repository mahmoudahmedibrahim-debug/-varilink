<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VariLink</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>/* Layout: drawing-sheet logic. A header strip, a title block for each change, and ledgers below. */
:root{--paper:#f2f4f3;--sheet:#fff;--ink:#14212b;--muted:#566571;--line:#d3dbdc;--accent:#0a56a0;--accent-ink:#fff;--soft:#e5eef6;--omit:#b3261e;--omit-soft:#fbe9e7;--add:#17703c;--add-soft:#e3f3e8;--abort:#8a5a00;--abort-soft:#fbf0d9;
--head:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10181e;--sheet:#172229;--ink:#e6edf0;--muted:#9fb0ba;--line:#2e3d46;--accent:#6db1f0;--accent-ink:#08253d;--soft:#1c3346;--omit:#ff9b92;--omit-soft:#40201e;--add:#77d39c;--add-soft:#173524;--abort:#eabf6a;--abort-soft:#3a2d12;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#10181e;--sheet:#172229;--ink:#e6edf0;--muted:#9fb0ba;--line:#2e3d46;--accent:#6db1f0;--accent-ink:#08253d;--soft:#1c3346;--omit:#ff9b92;--omit-soft:#40201e;--add:#77d39c;--add-soft:#173524;--abort:#eabf6a;--abort-soft:#3a2d12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--body)}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
p{margin:0}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--sheet);border-bottom:2px solid var(--ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 21px var(--head);letter-spacing:.02em;border:0;background:none;color:var(--ink);cursor:pointer;padding:0}
.brand span{color:var(--accent)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);flex:1;min-width:0}
.crumbs button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:2px}
.main{max-width:1240px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.main>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}.stack>*{min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.sample{font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--abort);background:var(--abort-soft);padding:3px 8px}
.sheet{background:var(--sheet);border:1px solid var(--line);padding:16px;min-width:0}
.titleblock{background:var(--sheet);border:2px solid var(--ink);display:grid;grid-template-columns:minmax(0,2.2fr) repeat(4,minmax(0,1fr))}
.titleblock>div{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.titleblock>div:first-child{border-left:0}
.tb-label{font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block}
.tb-val{font:600 20px var(--head)}
.tb-val.mono{font:600 16px var(--mono)}
.omit{color:var(--omit)}.add{color:var(--add)}.abort{color:var(--abort)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);font:600 16px var(--head);padding:8px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
button.btn,label.btn,a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:600 14px var(--body);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:none;color:var(--accent);padding:4px 6px}
button.danger{color:var(--omit)}
summary{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:6px 8px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
td input,td select{padding:4px 6px;background:transparent}
input[type=checkbox]{width:auto}
.field{display:grid;gap:3px}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid>*{min-width:0}
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12px var(--body);letter-spacing:.03em;text-align:left;color:var(--muted);background:var(--paper);border-bottom:1px solid var(--ink);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.band td{font:600 14px var(--head);background:var(--paper);letter-spacing:.03em}
tr.total td{font-weight:700;border-top:1px solid var(--ink)}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--soft)}
.chip{display:inline-block;font:600 12px var(--body);padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.chip.Omission{color:var(--omit)}.chip.Addition{color:var(--add)}.chip.Abortive{color:var(--abort)}
.chip.ok{color:var(--add)}.chip.wait{color:var(--abort)}.chip.stop{color:var(--omit)}.chip.ai{color:var(--accent)}
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.stage{flex:0 0 210px;border:1px solid var(--line);border-top:3px solid var(--accent);background:var(--sheet);padding:10px;display:grid;gap:6px}
.link-delta{flex:0 0 96px;display:grid;place-content:center;text-align:center;font:500 12px var(--mono);color:var(--muted);padding:0 6px;border-block:1px dashed var(--line);align-self:center;min-height:44px}
.alerts{display:grid;gap:6px}
.alert{padding:7px 10px;border-left:3px solid var(--abort);background:var(--abort-soft);font-size:14px}
.alert.error{border-color:var(--omit);background:var(--omit-soft)}
.alert.good{border-color:var(--add);background:var(--add-soft)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;background:var(--accent)}
.bar i.neg{background:var(--omit)}
dialog{border:2px solid var(--ink);background:var(--sheet);color:var(--ink);padding:18px;width:min(640px,calc(100vw - 32px));max-height:86vh;overflow:auto}
dialog::backdrop{background:rgb(10 20 30/.55)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;z-index:30;max-width:calc(100vw - 32px)}
.pre{font:12px/1.4 var(--mono);white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);padding:8px;max-height:160px;overflow:auto}
.route{display:grid;gap:8px;border:1px solid var(--line);padding:12px;min-width:0}
@media (max-width:800px){.titleblock{grid-template-columns:repeat(2,minmax(0,1fr))}.titleblock>div:first-child{grid-column:1/-1}.titleblock>div{border-left:0;border-top:1px solid var(--line)}.titleblock>div:first-child{border-top:0}.bar{grid-template-columns:90px minmax(0,1fr) 100px}}
@media (prefers-reduced-motion:no-preference){.tabs button{transition:background .12s}}
</style></head><body><header class="top"><button class="brand" id="brand">Vari<span>Link</span></button><nav class="crumbs" id="crumbs" aria-label="Location"></nav></header>
<main class="main" id="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>// VariLink calculation engine. Pure functions, no DOM and no AI.
(function (root) {
  const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };

  // Lump Sum and Design & Build keep BOQ quantities on full-item replacement.
  function measurementBasis(contractType) {
    if (contractType === 'Lump Sum' || contractType === 'Design & Build') return 'lumpsum';
    if (contractType === 'Re-measured') return 'remeasured';
    return 'actual';
  }

  function findBoq(pkg, code) { return (pkg.boq || []).find(b => b.code === code) || null; }

  function rateFor(line, pkg) {
    const contract = pkg.contract || {};
    const markup = num(contract.markupPct) / 100;
    const src = line.rateSource;
    if (src === 'BOQ' || src === 'Similar') {
      const b = findBoq(pkg, line.rateRef || line.boqCode);
      return { rate: b ? num(b.rate) : 0, basis: b ? `${src === 'BOQ' ? 'BOQ rate' : 'Similar item'} ${b.code}` : 'BOQ reference missing', direct: null };
    }
    if (src === 'Derived') {
      const b = findBoq(pkg, line.rateRef);
      const f = line.factor === '' || line.factor == null ? 1 : num(line.factor);
      return { rate: b ? round2(num(b.rate) * f) : 0, basis: b ? `Derived from ${b.code} x ${f}, all-in${line.derivation ? ': ' + line.derivation : ''}` : 'BOQ reference missing', direct: null };
    }
    if (src === 'New') {
      const direct = (line.breakdown || []).reduce((s, r) => s + num(r.qty) * num(r.rate), 0);
      if (direct > 0) return { rate: round2(direct * (1 + markup)), basis: `New rate: direct cost ${round2(direct)} + OH&P ${contract.markupPct || 0}%`, direct: round2(direct) };
      return { rate: num(line.rate), basis: line.quoteRef ? `Quotation ${line.quoteRef}` : 'New rate without build-up', direct: null };
    }
    return { rate: num(line.rate), basis: 'Manual rate', direct: null };
  }

  function computeLine(line, pkg) {
    const basis = measurementBasis((pkg.contract || {}).type);
    const boq = line.boqCode ? findBoq(pkg, line.boqCode) : null;
    const flags = [];
    let qty = 0, qtyBasis = '', rateInfo;

    if (line.action === 'Omission') {
      if (!boq) flags.push({ level: 'error', text: 'Omission needs a BOQ item.' });
      if (line.scope === 'full') {
        qty = boq ? num(boq.qty) : 0;
        qtyBasis = 'BOQ quantity: full item omitted';
      } else {
        qty = num(line.takeoffQty);
        qtyBasis = 'Actual take-off: part of item omitted';
        if (boq && qty > num(boq.qty)) flags.push({ level: 'warn', text: `Omitted take-off ${qty} exceeds BOQ quantity ${num(boq.qty)}.` });
      }
      rateInfo = boq ? { rate: num(boq.rate), basis: `BOQ rate ${boq.code}`, direct: null } : { rate: 0, basis: '', direct: null };
    } else {
      const replaced = line.replacesCode ? findBoq(pkg, line.replacesCode) : null;
      if (basis === 'lumpsum' && replaced) {
        qty = num(replaced.qty);
        qtyBasis = `BOQ quantity of ${replaced.code}: lump sum full replacement`;
        if (line.unit && replaced.unit && line.unit !== replaced.unit) flags.push({ level: 'warn', text: `Unit ${line.unit} differs from replaced item unit ${replaced.unit}; the fixed quantity needs review.` });
      } else {
        qty = num(line.takeoffQty);
        qtyBasis = 'Actual take-off from revised drawings';
      }
      rateInfo = rateFor(line, pkg);
      if (!rateInfo.rate) flags.push({ level: 'error', text: 'Rate is missing.' });
      if (line.rateSource === 'New' && !rateInfo.direct && !line.quoteRef) flags.push({ level: 'warn', text: 'New rate has no build-up or quotation.' });
    }

    if (!qty) flags.push({ level: 'error', text: 'Quantity is missing.' });
    if (line.source === 'AI' && !line.verified) flags.push({ level: 'warn', text: 'AI line is not verified yet.' });

    const sign = line.action === 'Omission' ? -1 : 1;
    const rate = rateInfo.rate;
    const amount = round2(sign * qty * rate);
    const contractorAmount = line.contractorQty === '' || line.contractorQty == null || line.contractorRate === '' || line.contractorRate == null ? null : round2(sign * num(line.contractorQty) * num(line.contractorRate));
    return { ...line, desc: line.desc || (boq ? boq.desc : ''), unit: line.unit || (boq ? boq.unit : ''), discipline: line.discipline || (boq ? boq.discipline : '') || 'General', qty, qtyBasis, rate, rateBasis: rateInfo.basis, direct: rateInfo.direct, sign, amount, contractorAmount, flags };
  }

  function computeChange(change, pkg) {
    const lines = (change.lines || []).map(l => computeLine(l, pkg));
    const abortive = [];
    if (change.abortive && change.abortive.status === 'Yes') {
      lines.filter(l => l.action === 'Omission' && num(l.executedQty) > 0).forEach(l => {
        const q = num(l.executedQty);
        abortive.push({ id: l.id + '-abortive', action: 'Abortive', desc: `Abortive work: ${l.desc}`, unit: l.unit, discipline: l.discipline, qty: q, qtyBasis: 'Executed quantity confirmed by the supervision consultant', rate: l.rate, rateBasis: l.rateBasis, sign: 1, amount: round2(q * l.rate), contractorAmount: null, flags: q > l.qty ? [{ level: 'warn', text: 'Executed quantity exceeds omitted quantity.' }] : [], boqCode: l.boqCode });
      });
    }
    const all = lines.concat(abortive);
    const sum = f => round2(all.filter(f).reduce((s, l) => s + l.amount, 0));
    const omissions = sum(l => l.action === 'Omission');
    const additions = sum(l => l.action === 'Addition');
    const abortiveTotal = sum(l => l.action === 'Abortive');
    const net = round2(omissions + additions + abortiveTotal);
    const priced = lines.filter(l => l.contractorAmount != null);
    const contractorTotal = priced.length ? round2(priced.reduce((s, l) => s + l.contractorAmount, 0)) : null;
    return { lines: all, omissions, additions, abortiveTotal, net, contractorTotal, flags: all.flatMap(l => (l.flags || []).map(f => ({ ...f, line: l.desc }))) };
  }

  const STAGE_ORDER = ['DCR', 'NoV', 'Notice of Claim', 'Cost Study', 'Damage Report', 'CR', 'VO'];

  function latestStage(change) { const s = change.stages || []; return s.length ? s[s.length - 1] : null; }

  // Approved VO amount is final; otherwise the live AAA assessment is used.
  function changeValue(change, pkg) {
    const calc = computeChange(change, pkg);
    const vo = (change.stages || []).find(s => s.kind === 'VO' && s.status === 'Approved' && s.approved !== '' && s.approved != null);
    const closed = (change.stages || []).some(s => s.status === 'Cancelled');
    const latest = latestStage(change);
    const analysed = (change.lines || []).length > 0;
    const assessed = analysed ? calc.net : latest ? num(latest.amount) : 0;
    return { calc, approved: vo ? num(vo.approved) : null, closed, analysed, assessed, contractor: calc.contractorTotal != null ? calc.contractorTotal : change.contractorSubmitted != null ? num(change.contractorSubmitted) : null, value: closed ? 0 : vo ? num(vo.approved) : assessed };
  }

  function chainChecks(change) {
    const out = [], stages = change.stages || [];
    for (let i = 1; i < stages.length; i++) {
      const delta = round2(num(stages[i].amount) - num(stages[i - 1].amount));
      if (delta !== 0 && !stages[i].deltaReason) out.push({ level: 'error', text: `${stages[i].kind} ${stages[i].no || ''} moved by ${delta} from ${stages[i - 1].kind} without a reason.` });
    }
    return out;
  }

  // Cross-change check: total omitted across the package against BOQ quantity.
  function boqOveromissions(pkg) {
    const totals = {};
    (pkg.changes || []).forEach(ch => {
      if ((ch.stages || []).some(s => s.status === 'Cancelled')) return;
      computeChange(ch, pkg).lines.filter(l => l.action === 'Omission' && l.boqCode).forEach(l => {
        totals[l.boqCode] = totals[l.boqCode] || { qty: 0, refs: [] };
        totals[l.boqCode].qty += l.qty; totals[l.boqCode].refs.push(ch.id);
      });
    });
    return Object.entries(totals).map(([code, t]) => {
      const b = findBoq(pkg, code);
      return b && round2(t.qty) > num(b.qty) ? { level: 'warn', code, text: `${code}: ${round2(t.qty)} ${b.unit} omitted across ${[...new Set(t.refs)].join(', ')}, BOQ holds ${num(b.qty)}.` } : null;
    }).filter(Boolean);
  }

  function packageSummary(pkg) {
    const boqSum = (pkg.boq || []).reduce((s, b) => s + num(b.qty) * num(b.rate), 0);
    const contractSum = pkg.contractAmount != null ? num(pkg.contractAmount) : boqSum;
    let approved = 0, pending = 0, omissions = 0, additions = 0, abortive = 0, contractorSubmitted = 0, unanalysed = 0;
    const byDiscipline = {};
    (pkg.changes || []).forEach(ch => {
      const v = changeValue(ch, pkg);
      if (v.closed) return;
      if (v.approved != null) approved += v.approved; else pending += v.assessed;
      if (!v.analysed) { unanalysed += v.value; const d = ch.discipline || 'Not broken down'; byDiscipline[d] = round2((byDiscipline[d] || 0) + v.value); }
      omissions += v.calc.omissions; additions += v.calc.additions; abortive += v.calc.abortiveTotal;
      if (v.contractor != null) contractorSubmitted += v.contractor;
      v.calc.lines.forEach(l => { byDiscipline[l.discipline] = round2((byDiscipline[l.discipline] || 0) + l.amount); });
    });
    const cumulative = round2(approved + pending);
    return { contractSum: round2(contractSum), approved: round2(approved), pending: round2(pending), cumulative, omissions: round2(omissions), additions: round2(additions), abortive: round2(abortive), unanalysed: round2(unanalysed), contractorSubmitted: round2(contractorSubmitted), byDiscipline, adjusted: round2(contractSum + cumulative), pct: contractSum ? cumulative / contractSum : 0 };
  }

  function logRows(pkg) {
    return (pkg.changes || []).map(ch => {
      const v = changeValue(ch, pkg), s = k => (ch.stages || []).find(x => x.kind === k) || {};
      const latest = latestStage(ch) || {};
      return { id: ch.id, title: ch.title, reason: ch.reason, reasonRef: ch.reasonRef, dcr: s('DCR'), nov: s('NoV'), claim: s('Notice of Claim'), cr: s('CR'), vo: s('VO'), si: (ch.si || []), contractor: v.contractor, assessed: v.assessed, approved: v.approved, stage: latest.kind || '', status: latest.status || '', variance: v.contractor == null ? null : round2(v.contractor - v.assessed), chain: (ch.stages || []).map(x => `${x.kind} ${x.no || ''}`.trim()).join(' > ') };
    });
  }

  // Compares an original / revised take-off table with the BOQ.
  function compareTakeoff(rows, pkg, tolerancePct) {
    const tol = (tolerancePct == null ? 5 : tolerancePct) / 100;
    return rows.map(r => {
      const b = findBoq(pkg, r.code), o = num(r.originalQty), n = num(r.revisedQty), delta = round2(n - o);
      const flags = [];
      if (r.code && !b) flags.push('Code is not in the BOQ');
      if (b && o && num(b.qty) && Math.abs(o - num(b.qty)) / num(b.qty) > tol) flags.push(`Original take-off ${o} differs from BOQ ${num(b.qty)}`);
      const action = delta < 0 ? 'Omission' : delta > 0 ? 'Addition' : null;
      const scope = action === 'Omission' && b && n === 0 ? 'full' : 'partial';
      return { ...r, boq: b, delta, action, scope, flags };
    });
  }

  const isoDate = v => {
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    const m = String(v || '').trim().match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
    return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
  };
  const txt = v => (v == null ? '' : String(v)).replace(/\s+/g, ' ').trim();
  const money2 = v => (typeof v === 'number' ? v : 0);

  function findHeader(sheets, tests) {
    for (const sh of sheets) for (let r = 0; r < Math.min(sh.rows.length, 30); r++) {
      const cells = (sh.rows[r] || []).map(txt);
      const map = {}; let ok = true;
      for (const [key, re] of Object.entries(tests)) { const i = cells.findIndex(c => re.test(c)); if (i < 0) ok = false; else map[key] = i; }
      if (ok) return { sheet: sh, row: r, col: map };
    }
    return null;
  }

  // Reads a project cost report: the package summary and the change management log.
  function parseCostReport(sheets) {
    const pk = findHeader(sheets, { ref: /^Package Ref/i, name: /^Package Name/i, contractor: /^Contractor$/i, type: /^Type of Contract/i, amount: /^Accepted Contract Amount/i });
    const lg = findHeader(sheets, { pkg: /^Package No/i, title: /^Change Description/i, reason: /^Reason for/i, cr: /^CR No/i, crDate: /^CR Creation Date/i, status: /^CR Status/i, est: /^CR Estimated Amount/i, vo: /^VO NO/i, voDate: /^Submission Date/i, aaa: /^AAA-Assessment/i, sub: /^Contractor Submission/i, app: /^Approved Amount/i, si: /^SWI\/CAI$/i, siDate: /^SWI\/CAI Date/i, comments: /^Comments/i });
    if (!pk) throw new Error('No package summary found. It needs Package Ref., Package Name, Contractor, Type of Contract and Accepted Contract Amount columns.');
    if (!lg) throw new Error('No change log found. It needs CR No, CR Status, VO No and Approved Amount columns.');
    const packages = [];
    pk.sheet.rows.slice(pk.row + 1).forEach(row => {
      const code = txt(row[pk.col.ref]);
      if (!/^(PKG|PK|DP)\s*#?\s*\d+/i.test(code)) return;
      const type = txt(row[pk.col.type]);

async function readSheet(file){const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());const ws=wb.worksheets[0];const val=c=>{const v=c.value;return v&&typeof v==='object'?(v.result!==undefined?v.result:v.text||(v.richText||[]).map(t=>t.text).join('')):v};
 let head=null;const out=[];ws.eachRow(row=>{const cells=[];row.eachCell({includeEmpty:true},(c,i)=>cells[i]=val(c));if(!head){if(cells.some(c=>/code|item/i.test(String(c)))&&cells.some(c=>/qty|quantity/i.test(String(c))))head=cells.map(c=>String(c||'').trim().toLowerCase());return}const o={};head.forEach((h,i)=>{if(h)o[h]=cells[i]});out.push(o)});
 if(!head)throw new Error('No header row found. Use the template columns.');return out}
async function readAllSheets(file){const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());const val=c=>{const v=c.value;if(v instanceof Date)return v;return v&&typeof v==='object'?(v.result!==undefined?v.result:v.text||(v.richText||[]).map(t=>t.text).join('')):v};return wb.worksheets.map(ws=>{const rows=[];ws.eachRow({includeEmpty:true},(row,n)=>{const c=[];for(let i=1;i<=ws.actualColumnCount+2&&i<=row.cellCount;i++)c[i-1]=val(row.getCell(i));rows[n-1]=c});return {name:ws.name,rows}})}

 if(d.delDoc){k.docs.splice(+d.delDoc,1);save();return render()}
 if(d.delSi){c.si.splice(+d.delSi,1);save();return render()}
 if(d.addBd){const l=c.lines[+d.addBd];l.breakdown=l.breakdown||[];l.breakdown.push({cat:'Supply',item:'',unit:'',qty:1,rate:0});save();return render()}
 if(d.delBd){const [i,j]=d.delBd.split('.');c.lines[+i].breakdown.splice(+j,1);save();return render()}
 if(d.aiCopy){const t=aiPrompt(d.aiCopy);try{await navigator.clipboard.writeText(t);toast('Request copied.')}catch(x){const ta=document.getElementById('ai-reply-'+d.aiCopy);ta.value=t;ta.select();toast('Copy this request from the box.')}return}
 if(d.aiSample){document.getElementById('ai-reply-'+d.aiSample).value=SAMPLE_REPLY();return aiApply(d.aiSample)}
 if(d.aiApply)return aiApply(d.aiApply);if(d.aiRun)return await aiRun(d.aiRun);
 switch(d.act){
  case 'settings':return openSettings();
  case 'newProject':return dialog(`<h2>New project</h2>${dInput('name','Project name')}${dInput('client','Client')}${dInput('currency','Currency','EGP')}`,x=>{const id=uid('p');state.projects.push({id,name:x.name,client:x.client,currency:x.currency,packages:[]});save();go({p:id})});
  case 'newPackage':return dialog(`<h2>New package</h2>${dInput('code','Package code','PK-')}${dInput('name','Package name')}${dInput('contractor','Contractor')}${dSel('type','Contract type',CONTRACTS,'Lump Sum')}`,x=>{const id=uid('k');P().packages.push({id,code:x.code,name:x.name,contractor:x.contractor,contract:{type:x.type,typeOther:'',markupPct:30,vatPct:14,designFeesIncluded:'No',iftIsIfc:'Yes',geotech:'Yes',pricingClause:'',paymentClause:'',notes:''},docs:[],boq:[],changes:[]});save();go({p:view.p,k:id,tab:'contract'})});
  case 'newChange':return newChange();case 'convert':return convertStage();
  case 'addBoq':k.boq.push({code:'',desc:'',unit:'',qty:0,rate:0,discipline:''});save();return render();
  case 'addSi':c.si=c.si||[];c.si.push({no:'',date:'',ref:''});save();return render();
  case 'exportVA':return await exportVA();case 'exportLog':return await exportLog();case 'exportProjectLog':return await exportProjectLog();
  case 'exportJson':{const p=P();return await saveBlob(`${p.name}.varilink.json`,new Blob([JSON.stringify(p,null,1)],{type:'application/json'}))}
  case 'tplBoq':return await template('BOQ template.xlsx',['Code','Description','Unit','Qty','Rate','Discipline'],[['F-101','Sample item','m2',100,250,'Finishes']]);
  case 'tplTakeoff':return await template('Take-off template.xlsx',['Code','Description','Unit','Original Qty','Revised Qty'],[['F-101','Sample item','m2',100,80]]);
  case 'applyTakeoff':{let n=0;takeoffRows.filter(r=>r.action).forEach(r=>{const q=Math.abs(r.delta);if(r.action==='Omission')c.lines.push({id:uid('l'),action:'Omission',scope:r.scope,boqCode:r.boq?r.code:'',takeoffQty:q});else c.lines.push({id:uid('l'),action:'Addition',desc:r.desc||(r.boq&&r.boq.desc)||'',unit:r.unit||(r.boq&&r.boq.unit)||'',takeoffQty:q,rateSource:r.boq?'BOQ':'Manual',rateRef:r.boq?r.code:'',discipline:r.boq&&r.boq.discipline});n++});takeoffRows=null;save();render();return toast(`${n} lines created.`)}
 }}catch(err){toast(err.message||'That action failed.')}});
window.addEventListener('hashchange',()=>{fromHash();render()});
document.addEventListener('input',e=>{const m=(e.target.id||'').match(/^ai-reply-(.+)/);if(m)aiText[m[1]]=e.target.value});
document.addEventListener('paste',e=>{const m=(e.target.id||'').match(/^ai-reply-(.+)/);if(m)setTimeout(()=>{if(/\{[\s\S]*\}/.test(e.target.value))aiApply(m[1])},0)});
$('#brand').addEventListener('click',()=>go({}));
fromHash();if(!view.p&&state.projects.length)view={p:state.projects[0].id,k:null,c:null,tab:null};render();
})();
</script></body></html>
